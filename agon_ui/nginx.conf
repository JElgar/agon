# Link-preview crawlers (WhatsApp, Facebook/Messenger, Slack, Telegram,
# Discord, LinkedIn, Skype, VK, reddit, Viber, Line, ...) generate a link's
# preview by fetching the URL and reading its response HTML's <head> tags
# directly — they never run the SPA's JS, so a client-rendered route's tags
# (baked in after React Router mounts) are invisible to them. `location /`
# below sends exactly these user agents to agon_service's server-rendered
# `/share/...` pages (see agon_service/src/share.rs) instead of the SPA
# shell, for *any* app route pasted anywhere — not just the app's own share
# buttons. General search crawlers (Googlebot, Bingbot, ...) are
# deliberately excluded: unlike a chat app's one-shot unfurl fetch, a search
# engine is expected to see the real page, not a stub that immediately
# meta-refreshes elsewhere.
map $http_user_agent $is_link_crawler {
    default 0;
    "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|Slackbot|TelegramBot|Discordbot|LinkedInBot|SkypeUriPreview|vkShare|redditbot|Viber|Line/)" 1;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback: client-side routes like /invite/<token>, /matches/<id>, etc.
    # have no file on disk. Serve index.html so React Router can handle them on a
    # cold load — critical for invite links, which brand-new users open before
    # any service worker (with its own navigateFallback) is installed.
    location / {
        # nginx has no `&&` in `if` — chain two ifs into one variable instead
        # (the standard workaround). `$bot_and_missing` only stays "check"
        # when *both* hold: the UA is a crawler (map above) AND `$uri` isn't a
        # real file, i.e. this is a client-side route, not a static asset.
        # That second half matters: the same crawler UA commonly re-fetches
        # the page's own `og:image` (e.g. the /pwa-512x512.png fallback,
        # served off this very domain — see `share::render`'s default image)
        # as a separate request, which must come back as the real PNG, not
        # an HTML stub.
        set $bot_and_missing "";
        if ($is_link_crawler) {
            set $bot_and_missing "check";
        }
        if (-f $request_filename) {
            set $bot_and_missing "";
        }
        # `proxy_set_header` isn't allowed inside an `if` block, so it's set
        # unconditionally here — harmless when the `if` below doesn't fire,
        # since then `proxy_pass` (and so this header) is never used at all.
        proxy_set_header Host $host;
        if ($bot_and_missing = "check") {
            # In-cluster call straight to the `agon` Service (agon_infra's
            # `agon-service`/`service`, port 7000) — not the public `/api`
            # ingress, which this pod doesn't need to hairpin through for a
            # same-cluster call. Only reachable (and only exercised) inside
            # that deployment; local dev never runs this nginx image at all
            # (Vite's own dev-server proxy handles `/api` instead — see
            # vite.config.ts).
            proxy_pass http://agon.default.svc.cluster.local:7000/share$uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # The runtime-env file is rewritten at container start (envsubst) and must
    # never be cached, so a redeployed Supabase URL/key takes effect immediately.
    location ~* runtime-env.*\.js$ {
        add_header Cache-Control "no-store";
    }

    # index.html and the service worker/manifest must always be revalidated.
    # Without this, nginx sends no Cache-Control at all and browsers apply
    # heuristic caching, so a plain reload can serve a stale index.html/sw.js
    # straight from the HTTP cache and never even ask the service worker
    # update machinery to run — only a hard refresh (which bypasses HTTP
    # cache) picks up a new deploy. Hashed files under /assets/ are
    # content-addressed and safe to cache normally.
    location ~* ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
