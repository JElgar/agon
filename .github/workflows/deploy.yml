on:
  workflow_call:
    inputs:
      # Optional: the release workflow only publishes (and passes) the images
      # whose source actually changed. An empty string means "unchanged, keep
      # whatever is already in the pulumi stack config" — see the "Update
      # agon image in pulumi stack config" step below.
      agon-service-image:
        required: false
        type: string
        default: ''
      agon-worker-image:
        required: false
        type: string
        default: ''
      agon-ui-image:
        required: false
        type: string
        default: ''
      stack-name:
        required: true
        type: string
    outputs:
      agon-url:
        value: ${{ jobs.deploy.outputs.agon-url }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: agon_infra

    environment:
      name: ${{ inputs.stack-name }}
      url: https://${{ steps.pulumi-up.outputs.agonDomain }}

    outputs:
      agon-url: https://${{ steps.pulumi-up.outputs.agonDomain }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - run: pnpm install

      # release.yml only builds and passes an image for the service(s) whose
      # source actually changed; an empty input here means "unchanged", so
      # leave that image's pulumi config as-is rather than clobbering it.
      - name: Update agon image in pulumi stack config
        run: |
          pulumi stack select ${{ inputs.stack-name }}
          if [ -n "${{ inputs.agon-service-image }}" ]; then
            pulumi config set agonServiceImage ${{ inputs.agon-service-image }}
          fi
          if [ -n "${{ inputs.agon-worker-image }}" ]; then
            pulumi config set agonWorkerImage ${{ inputs.agon-worker-image }}
          fi
          if [ -n "${{ inputs.agon-ui-image }}" ]; then
            pulumi config set agonUiImage ${{ inputs.agon-ui-image }}
          fi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: 'agon_infra/Pulumi.${{ inputs.stack-name }}.yaml'
          message: |
            ${{ inputs.stack-name }} release
            agon-service-image ${{ inputs.agon-service-image }}
            agon-worker-image ${{ inputs.agon-worker-image }}
            agon-ui-image ${{ inputs.agon-ui-image }}

      - uses: pulumi/actions@v6
        id: pulumi-up
        with:
          command: up
          stack-name: ${{ inputs.stack-name }}
          work-dir: ./agon_infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

