[package]
name = "agon_worker"
version = "0.1.0"
edition = "2024"

# The async processing worker. Long-polls the SQS queue fed by DynamoDB Streams
# (via an EventBridge Pipe) and runs inline handlers: search indexing
# (Meilisearch) and notification generation.
#
# Multi-step orchestration (feed fan-out, the accept-invitation saga) lives in
# the `temporal` module and runs a Temporal worker alongside the consumer loop
# in this same binary. See docs/async-design.md.
#
# Shares the DynamoDB data-access layer with the API via agon_core. No poem.

[dependencies]
agon_core = { path = "../agon_core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1"
serde = { version = "1.0.209", features = ["derive"] }
# `float_roundtrip` is not optional here. The Temporal payload converter
# deserializes every workflow/activity argument through `serde_json::Value`
# (`temporalio-common-wasm`'s `SerdeJsonPayloadConverter`), and serde_json's
# default float parser is fast rather than correctly rounded — it lands within
# 1 ULP. `RepairRatings` carries a rating's μ/σ across that boundary between
# every chunk, and the whole repair design rests on a replay reproducing the
# incremental numbers *bit for bit*, so a single-ULP drift per hop is the
# difference between "converged, wrote nothing" and "rewrite every rating on
# every run". Cargo feature unification is what makes declaring it here reach
# the transitive dependency that actually does the parsing; the coupling is
# invisible in the source, so it is pinned by
# `handlers::rating::tests::a_rating_survives_the_temporal_payload_round_trip`,
# which fails without this feature.
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
# Deserializes DynamoDB Streams images (attribute-value JSON) straight into the
# shared record structs — same crate agon_core uses for item (de)serialization.
serde_dynamo = "4"
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0.64"
tracing = "0.1.41"
# Subscriber setup + OTLP export is centralised in agon_core::telemetry.
futures = "0.3"

# Temporal Rust SDK (durable orchestration for the multi-step async work).
temporalio-sdk = "0.5.0"
temporalio-client = "0.5.0"
temporalio-sdk-core = "0.5.0"
temporalio-macros = "0.5.0"
# Referenced by the workflow/activity macro expansions (`::temporalio_workflow::…`)
# and for the WorkflowIdConflictPolicy enum, so both must be direct deps.
temporalio-workflow = "0.5.0"
temporalio-common = "0.5.0"
