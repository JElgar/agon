[package]
name = "agon_core_wasm"
version = "0.1.0"
edition = "2024"

# The browser's bindings to `agon_core`, built with wasm-bindgen into
# `agon_ui/src/wasm/agon_core` (gitignored) by `npm run build:wasm`. Kept to
# a thin JSON-in/JSON-out shim so `agon_core` itself never depends on
# wasm-bindgen and the UI's types are the serde shapes `agon_core` tests.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agon_core = { path = "../agon_core" }
serde_json = "1"
# Pinned exactly: the `wasm-bindgen` CLI that generates the JS glue must be
# this same version (see agon_ui's `build:wasm` script and build-ui.yml).
wasm-bindgen = "=0.2.100"
