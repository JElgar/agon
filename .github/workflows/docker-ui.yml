on:
  workflow_call:
    outputs:
      image:
        description: 'Full container image reference with tag'
        value: ${{ jobs.docker-push.outputs.image }}

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[1] }}

    steps:
      - uses: actions/checkout@v4

      # The generated OpenAPI client types just need to be present in the
      # build context before `docker build` below — pull the copy build-ui.yml
      # already generated (which itself required a full `./.github/actions/setup`
      # Rust workspace build to produce schema.json) rather than paying for
      # that same Rust build again on this job's own runner. This job needs no
      # Rust/npm toolchain at all now; `npm ci` runs inside the Docker build.
      - uses: actions/download-artifact@v4
        with:
          name: agon-ui-openapi-types
          path: agon_ui/src/types

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jelgar/agon_ui
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./agon_ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: the GHA cache backend occasionally 504s with an
          # HTML error page instead of JSON ("invalid character '<' looking
          # for beginning of value") — a flaky GitHub-side cache API issue,
          # not a build problem. Without this the whole push fails even
          # though the image itself built fine; with it, a failed cache
          # export just means the next build warms the cache from scratch.
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64
