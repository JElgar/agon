<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#2952D9" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      iOS Safari has no `beforeinstallprompt`/install-banner API (unlike
      Chrome/Android) and ignores the web manifest's `display: standalone`.
      Without this tag, a page added via Share -> Add to Home Screen still
      opens inside Safari's browser chrome instead of as a standalone app.
      `mobile-web-app-capable` is the non-prefixed standard other engines
      (and iOS 17.4+) read; keep the `apple-` one too for older iOS.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Bricolage Grotesque: display face for headings and large numerals.
      DM Sans: body copy, the default sans throughout the app.
      Fraunces (italic only): the wordmark and italic section titles.
      See the "Agon redesign" canvas (claude.ai/artifact/MKvQ8bNeKnqHzxqZfMNFnc).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap"
      rel="stylesheet"
    />
    <title>Agon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
