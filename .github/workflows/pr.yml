name: PR

on:
  pull_request:

jobs:
  changes:
    # Same-repo relative path so this resolves against the PR branch itself
    # (see the note in release.yml).
    uses: ./.github/workflows/changes.yml

  build-service:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.worker == 'true'
    uses: JElgar/agon/.github/workflows/build-service.yml@main
    secrets: inherit

  build-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: JElgar/agon/.github/workflows/build-ui.yml@main
    secrets: inherit

  build-garmin:
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    # Same-repo relative path (not `@main`, unlike build-service/build-ui
    # above): the garmin filter also fires on edits to build-garmin.yml
    # itself, and those only get tested here if the PR's own version of the
    # file is what runs.
    uses: ./.github/workflows/build-garmin.yml
    secrets: inherit
