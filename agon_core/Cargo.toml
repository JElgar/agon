[package]
name = "agon_core"
version = "0.1.0"
edition = "2024"

# Sport scoring logic shared by every target that folds live events into a
# score: the backend (agon_service) today, web (via wasm-bindgen) and mobile
# (via UniFFI) later. Deliberately free of any backend dependency (no AWS
# SDK, no web framework, no tokio) so it stays buildable for wasm32 and for
# UniFFI's target platforms.

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
# Optional: lets a backend consumer (agon_service) use these types directly
# as its OpenAPI wire types instead of mirroring them, via the `openapi`
# feature below. Never enabled for a wasm32 or UniFFI build, which is the
# whole reason this is optional — `poem-openapi` pulls in `poem`, a full
# async web framework, which has no business in a client-side build.
poem-openapi = { version = "5", features = ["chrono"], optional = true }

[features]
openapi = ["poem-openapi"]

[dev-dependencies]
serde_json = "1"
