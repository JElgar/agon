# Own workspace, separate from the shippable root workspace, so a clean checkout
# / Docker build of the service or worker never references the generated
# (gitignored) openapi_client. This is a single-package workspace; openapi_client
# is pulled in as an external path dependency (below), which does NOT require it
# to be a workspace member. Run tests via
# `cargo test --manifest-path agon_tests/Cargo.toml`.
[workspace]

[package]
name = "agon_tests"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
chrono = "0.4"
jsonwebtoken = "9.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
progenitor = { git = "https://github.com/oxidecomputer/progenitor" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openapi = { path = "../openapi_client" }
# The shared DAO, used *only* by the rating tests — ratings have no API
# surface until phase 3, so asserting on them means reading the table these
# tests' service is writing to. A path dependency on a crate outside this
# workspace, exactly like `openapi` above. Deliberately the real DAO rather
# than a raw `aws-sdk-dynamodb` client: it means the assertions go through the
# same typed `Pk`/`Sk` keys and record shapes the service and worker use, so a
# key or field rename can't leave a test passing against a stale hand-written
# key string.
agon_core = { path = "../agon_core" }
# For the two places a test has to write a match field the API cannot set yet
# (`ranked`) — a raw `UpdateItem` against the same table, still keyed through
# `agon_core`'s `Pk`/`Sk`.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"

uuid = { version = "1.16.0", features = ["v4"] }
