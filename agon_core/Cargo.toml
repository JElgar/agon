[package]
name = "agon_core"
version = "0.1.0"
edition = "2024"

# Shared domain crate: DynamoDB DAO + record types + Meilisearch client.
# Depended on by both the API (agon_service) and the async worker (agon_worker).
# Deliberately free of any web-framework (poem) dependency.

[dependencies]
thiserror = "1.0.64"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
# Only the timer, for backoff between DynamoDB batch-retry attempts.
tokio = { version = "1", features = ["time"] }
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls"] }
# Weng-Lin / OpenSkill ratings, the engine behind `rating`. MIT/Apache-2.0
# and unencumbered — TrueSkill, the algorithm it approximates, is patented
# until 2029 and licensed only for Xbox Live and non-commercial use, which
# rules it out for a project aiming to go professional.
#
# Default features only: the optional `serde` feature derives on the crate's
# own `WengLinRating`, and we deliberately store our own `mu`/`sigma` on our
# own record types rather than serializing a third-party struct into the
# table (see `rating::PlayerRating`).
skillratings = "0.29"
# FCM HTTP v1 client (`push`) — auto-generated from Google's own fcm:v1 API
# schema, so it tracks the API surface (platform-specific payload options)
# without us hand-maintaining request/response types. Re-exports the
# `hyper_rustls`/`hyper_util`/`yup_oauth2` versions it was built against, so
# only `yup-oauth2` needs its own explicit entry (for its service-account
# auth types used directly in `push`).
google-fcm1 = "7.0.0"
# Service-account OAuth2 (JWT bearer) flow for the FCM client: signs the
# assertion, exchanges it for an access token, and caches/refreshes it —
# handled internally, not something `push` reimplements.
yup-oauth2 = "12.1.2"

# Observability: OTLP export of logs, traces and metrics. `telemetry::init`
# wires the `tracing` ecosystem to an OTLP collector (Grafana Alloy in prod);
# both binaries call it at startup. See docs/observability.md.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
# Only for `crypto::ring::default_provider().install_default()` in
# `telemetry::init` — see its doc comment. `ring` (not `aws-lc-rs`) to match
# what the Temporal SDK / reqwest's `rustls-tls` already pull in.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
